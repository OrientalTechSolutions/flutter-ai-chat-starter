name: ai_chat_starter
description: >-
  A Flutter chat app that streams replies from ChatGPT, Gemini or Claude
  through a small Dart proxy, so API keys never ship inside the app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  # 1.3.0 moved the web client to fetch, which streams response bodies.
  http: ^1.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

# Regenerate the launcher icons with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  adaptive_icon_background: "#2962FF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_monochrome: assets/icon/app_icon_foreground.png
  ios: true
  # iOS rounds the corners itself, so it gets the full-bleed version.
  image_path_ios: assets/icon/app_icon_ios.png
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#2962FF"
