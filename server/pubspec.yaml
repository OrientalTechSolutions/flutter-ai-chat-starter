name: chat_proxy
description: >-
  A small streaming proxy that keeps AI provider keys on the server and
  forwards normalized text deltas to the Flutter app.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  http: ^1.2.2
  shelf: ^1.4.2
  shelf_router: ^1.1.4

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
